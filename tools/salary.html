<body>
  <header class="site-header"><div class="header-inner"><a class="brand" href="../index.html"><span class="brand-mark">20</span><span data-site-name>20代キャリア診断ラボ</span></a><button class="nav-toggle" type="button" aria-label="メニュー" aria-expanded="false" data-nav-toggle>≡</button><nav class="global-nav" data-nav><a href="salary.html">年収診断</a><a href="it-fit.html">IT適性</a><a href="interview.html">面接回答</a><a href="../articles/salary-up.html">記事</a></nav></div></header>
  <main class="section"><div class="container article">
    <span class="eyebrow">無料診断</span><h1>第二新卒 年収アップ可能性診断</h1><p class="lead">5つの質問に答えると、転職で年収アップを狙える可能性と今やるべき準備が分かります。</p>
    <div class="card">
      <h2>診断フォーム</h2>
      <form class="form" data-tool-form="salary">
        <div class="field"><label for="age">年齢</label><select id="age" name="age" required><option value="23">23歳以下</option><option value="25">24〜25歳</option><option value="27">26〜27歳</option><option value="29">28〜29歳</option></select></div>
        <div class="field"><label for="income">現在の年収</label><select id="income" name="income" required><option value="300">300万円未満</option><option value="350">300〜349万円</option><option value="420">350〜449万円</option><option value="500">450万円以上</option></select></div>
        <div class="field"><label for="experience">社会人経験</label><select id="experience" name="experience" required><option value="1">1年未満</option><option value="1.5">1〜2年</option><option value="2">2〜3年</option><option value="4">4年以上</option></select></div>
        <div class="field"><label for="industry">現在の経験に近いもの</label><select id="industry" name="industry" required><option value="sales">営業・販売</option><option value="it">IT・Web</option><option value="office">事務・管理</option><option value="service">接客・サービス</option><option value="other">その他</option></select></div>
        <div class="field"><label for="action">転職活動の準備状況</label><select id="action" name="action" required><option value="active">すでに求人を見ている</option><option value="soon">1〜3か月以内に始めたい</option><option value="thinking">まだ情報収集中</option></select></div>
        <button class="button cta" type="submit">診断結果を見る</button>
      </form>
      <div class="result" data-result><span class="result-score" data-result-score></span><h2 class="result-title" data-result-title></h2><p class="result-copy" data-result-copy></p><div class="share-box" data-share-copy></div><div class="result-actions"><a class="button cta" data-cta-primary-url href="#"><span data-cta-primary-text>自分に合う転職サポートを見てみる</span></a><a class="button ghost" href="../tools/motivation.html">志望動機も作る</a></div><p class="small" data-cta-note></p></div>
    </div>
  </div></main>
