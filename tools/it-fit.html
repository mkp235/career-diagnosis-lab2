  <main class="section"><div class="container article">
    <span class="eyebrow">無料診断</span><h1>未経験IT職種 適性診断</h1><p class="lead">エンジニアだけでなく、IT営業やサポート職も含めて向いている入口を診断します。</p>
    <div class="card">
      <h2>診断フォーム</h2>
      <form class="form" data-tool-form="itFit">
        <div class="field"><span class="question-title">筋道立てて考えるのは好きですか？</span><div class="option-grid"><label class="option"><input type="radio" name="logic" value="yes" required>はい</label><label class="option"><input type="radio" name="logic" value="no">どちらかといえば苦手</label></div></div>
        <div class="field"><span class="question-title">予定や情報を整理するのは得意ですか？</span><div class="option-grid"><label class="option"><input type="radio" name="organize" value="yes" required>はい</label><label class="option"><input type="radio" name="organize" value="no">普通</label></div></div>
        <div class="field"><span class="question-title">人と話して提案することに抵抗はありますか？</span><div class="option-grid"><label class="option"><input type="radio" name="talk" value="yes" required>抵抗は少ない</label><label class="option"><input type="radio" name="talk" value="no">できれば少なめが良い</label></div></div>
        <div class="field"><span class="question-title">困っている人をサポートするのは好きですか？</span><div class="option-grid"><label class="option"><input type="radio" name="support" value="yes" required>はい</label><label class="option"><input type="radio" name="support" value="no">普通</label></div></div>
        <div class="field"><label for="study">学習ペース</label><select id="study" name="study" required><option value="daily">毎日少しずつできる</option><option value="weekly">週末中心ならできる</option><option value="low">まだ自信がない</option></select></div>
        <button class="button cta" type="submit">適性を見る</button>
      </form>
      <div class="result" data-result><span class="result-score" data-result-score></span><h2 class="result-title" data-result-title></h2><p class="result-copy" data-result-copy></p><div class="share-box" data-share-copy></div><div class="result-actions"><a class="button cta" data-cta-secondary-url href="#"><span data-cta-secondary-text>未経験IT向けの選択肢を見てみる</span></a><a class="button ghost" href="interview.html">面接回答を作る</a></div><p class="small" data-cta-note></p></div>
    </div>
