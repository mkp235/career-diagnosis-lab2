  <main class="section"><div class="container article">
    <span class="eyebrow">無料ツール</span><h1>退職理由ポジティブ変換ツール</h1><p class="lead">本音をそのまま言いづらい退職理由を、面接で使いやすい言い方に整えます。</p>
    <div class="card">
      <h2>変換フォーム</h2>
      <form class="form" data-tool-form="reason">
        <div class="field"><label for="reason">元の退職理由</label><textarea id="reason" name="reason" placeholder="例：残業が多く、成長実感も少なかった"></textarea></div>
        <div class="field"><label for="focus">前向きに見せたい方向性</label><select id="focus" name="focus" required><option value="growth">成長・挑戦</option><option value="culture">社風・チーム</option><option value="work">働き方・継続性</option></select></div>
        <button class="button cta" type="submit">変換する</button>
      </form>
      <div class="result" data-result><span class="result-score" data-result-score></span><h2 class="result-title" data-result-title></h2><p class="result-copy" data-result-copy></p><div class="share-box" data-share-copy></div><div class="result-actions"><a class="button cta" data-cta-primary-url href="#"><span data-cta-primary-text>自分に合う転職サポートを見てみる</span></a><a class="button ghost" href="interview.html">面接回答も作る</a></div><p class="small" data-cta-note></p></div>
