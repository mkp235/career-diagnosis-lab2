  <main class="section"><div class="container article">
    <span class="eyebrow">無料ツール</span><h1>面接回答メーカー</h1><p class="lead">質問タイプとエピソードを入れると、第二新卒・20代向けの回答例を生成します。</p>
    <div class="card">
      <h2>作成フォーム</h2>
      <form class="form" data-tool-form="interview">
        <div class="field"><label for="question">質問タイプ</label><select id="question" name="question" required><option value="selfpr">自己PRをしてください</option><option value="change">転職理由を教えてください</option><option value="weakness">弱みを教えてください</option></select></div>
        <div class="field"><label for="strength">伝えたい強み・特徴</label><input id="strength" name="strength" placeholder="例：主体的に改善できること"></div>
        <div class="field"><label for="episode">使いたいエピソード</label><textarea id="episode" name="episode" placeholder="例：顧客対応で問い合わせ分類を見直し、対応時間を短縮した"></textarea></div>
        <div class="field"><label for="future">入社後に実現したいこと</label><input id="future" name="future" placeholder="例：早く業務を覚えてチームに貢献すること"></div>
        <button class="button cta" type="submit">回答例を作る</button>
      </form>
      <div class="result" data-result><span class="result-score" data-result-score></span><h2 class="result-title" data-result-title></h2><p class="result-copy" data-result-copy></p><div class="share-box" data-share-copy></div><div class="result-actions"><a class="button cta" data-cta-primary-url href="#"><span data-cta-primary-text>自分に合う転職サポートを見てみる</span></a><a class="button ghost" href="reason.html">退職理由を変換</a></div><p class="small" data-cta-note></p></div>
    </div>
  </div></main>
